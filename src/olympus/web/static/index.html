<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ariadne · Olympus4SWE 研发编排与独立验收控制台</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("olympus-theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.dataset.theme = saved;
        }
      } catch (error) {
        return;
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="cockpit">
    <nav id="rail" class="scroller" aria-label="工作台导航">
      <div class="rail-head-row">
        <div class="rail-brand">
          <span class="rail-mark" aria-hidden="true">◈</span>
          <span class="rail-wordmark">Ariadne</span>
        </div>
        <button type="button" class="btn btn-quiet" id="btn-rail-collapse" aria-expanded="true" aria-label="折叠导航">⇤</button>
      </div>
      <p class="rail-section-title">视图</p>
      <div class="rail-nav">
        <a class="rail-link" href="#topology" data-view="topology" aria-current="page">
          <span class="rail-glyph" aria-hidden="true">◇</span>
          <span class="rail-label">拓扑</span>
        </a>
        <a class="rail-link" href="#matrix" data-view="matrix">
          <span class="rail-glyph" aria-hidden="true">▦</span>
          <span class="rail-label">矩阵</span>
        </a>
        <a class="rail-link" href="#waterfall" data-view="waterfall">
          <span class="rail-glyph" aria-hidden="true">▤</span>
          <span class="rail-label">瀑布</span>
        </a>
      </div>
      <div class="rail-foot">
        <label class="rail-foot-label" for="run-selector">运行实例</label>
        <div class="rail-foot-controls">
          <select id="run-selector" class="run-select" aria-label="切换运行实例"></select>
          <button type="button" class="btn btn-quiet" id="theme-toggle" aria-label="切换主题">☾</button>
        </div>
      </div>
    </nav>

    <main id="stage" class="scroller">
      <header class="stage-head">
        <div class="stage-title-row">
          <h1 class="stage-title" id="run-title">Ariadne 研发编排控制台</h1>
          <span class="stage-kicker" id="run-kicker">事件溯源 · 只读投影</span>
        </div>
        <div class="stage-bar-row">
          <nav class="stage-pipeline" id="stage-pipeline" aria-label="阶段进度"></nav>
          <div class="stage-actions">
            <button type="button" class="btn" id="btn-dock-open" hidden>打开检查器</button>
            <button type="button" class="btn btn-danger" id="btn-toggle-pause">暂停全部</button>
          </div>
        </div>
        <div class="stat-band" id="stat-band" aria-label="运行指标"></div>
        <section class="hitl-banner" id="hitl-banner" data-tone="danger" aria-live="polite" hidden>
          <p class="hitl-headline" id="hitl-headline">正在加载编排状态…</p>
          <div class="hitl-actions">
            <button type="button" class="btn btn-primary" id="btn-banner-hint">注入提示</button>
            <button type="button" class="btn" id="btn-banner-inspect">查看定位</button>
            <button type="button" class="btn" id="btn-banner-retry">重试</button>
            <button type="button" class="btn" id="btn-banner-reassign">改派给人</button>
            <button type="button" class="btn btn-danger hitl-risk-sep" id="btn-banner-accept-risk">接受风险</button>
          </div>
        </section>
      </header>

      <section class="view" data-pane="topology" id="view-topology" aria-labelledby="topology-title">
        <header class="view-head">
          <h2 class="view-title" id="topology-title">任务依赖图</h2>
          <div class="dag-legend" aria-label="图例">
            <span class="legend-item">✓ 已验收</span>
            <span class="legend-item">▶ 运行中</span>
            <span class="legend-item">✕ 阻塞</span>
            <span class="legend-item">⚠ 人工接受</span>
            <span class="legend-item">◷ 等待</span>
            <span class="legend-item"><span class="legend-swatch" data-tone="critical" aria-hidden="true"></span> 关键路径</span>
            <span class="legend-item"><span class="legend-swatch" data-tone="blocked" aria-hidden="true"></span> 阻塞传递</span>
          </div>
        </header>
        <div class="dag-frame scroller">
          <svg class="dag-svg" id="dag-svg" role="img" aria-label="任务依赖有向无环图" viewBox="0 0 760 216"></svg>
        </div>
        <section class="lane-section" aria-labelledby="lane-title">
          <div class="card-head">
            <h3 class="card-title" id="lane-title">Agent 泳道（时间 →）</h3>
            <span class="card-note" id="lane-badge">隔离通道</span>
          </div>
          <div class="lanes" id="swimlanes"></div>
        </section>
      </section>

      <section class="view" data-pane="matrix" id="view-matrix" aria-labelledby="matrix-title" hidden>
        <header class="view-head">
          <h2 class="view-title" id="matrix-title">需求追踪矩阵</h2>
          <div class="stage-pills" id="fr-strip" aria-label="需求验证状态汇总"></div>
        </header>
        <div class="table-wrapper scroller" tabindex="0" role="region" aria-labelledby="matrix-caption">
          <table class="matrix-table">
            <caption id="matrix-caption">需求与任务双向追踪及验收结果表</caption>
            <thead>
              <tr>
                <th scope="col">需求编号</th>
                <th scope="col">来源与需求描述</th>
                <th scope="col">承接任务</th>
                <th scope="col">验收状态与证据</th>
              </tr>
            </thead>
            <tbody id="matrix-tbody"></tbody>
          </table>
        </div>
      </section>

      <section class="view" data-pane="waterfall" id="view-waterfall" aria-labelledby="waterfall-title" hidden>
        <header class="view-head">
          <h2 class="view-title" id="waterfall-title">Turn 瀑布</h2>
          <span class="badge" data-variant="muted" id="waterfall-count">0 turns</span>
        </header>
        <div class="waterfall" id="waterfall-list"></div>
      </section>

      <footer class="stage-foot">
        <span id="foot-note">Ariadne M4</span>
      </footer>
    </main>

    <div id="dock-resizer" role="separator" aria-orientation="vertical" aria-label="调整检查器宽度" tabindex="0"></div>

    <aside id="dock" class="scroller" aria-label="任务检查器">
      <header class="dock-head">
        <div>
          <span class="dock-kicker">检查器</span>
          <h2 class="dock-title" id="dock-title">任务执行详情</h2>
        </div>
        <button type="button" class="btn btn-quiet" id="btn-dock-close" aria-label="收起检查器">⇥</button>
      </header>
      <div class="dock-stages" id="dock-stages"></div>
      <div id="dock-subpane"></div>
      <div class="tool-list" id="dock-tools"></div>
      <div id="dock-tabs">
        <div class="tabs" role="tablist" aria-label="任务详情视图切换">
          <button type="button" role="tab" class="tab" data-tab="overview" aria-selected="true">概览</button>
          <button type="button" role="tab" class="tab" data-tab="artifacts" aria-selected="false">产物与审查</button>
          <button type="button" role="tab" class="tab" data-tab="events" aria-selected="false">事件日志</button>
        </div>
      </div>
      <div class="dock-body" id="dock-body"></div>
      <div id="dock-receipt"></div>
    </aside>
  </div>

  <dialog id="hitl-dialog" closedby="any" aria-labelledby="hitl-dialog-title">
    <form method="dialog" id="hitl-dialog-form">
      <h2 class="dialog-title" id="hitl-dialog-title">人工关口操作</h2>
      <p class="dialog-desc" id="hitl-dialog-desc"></p>
      <label class="dialog-label" for="hitl-dialog-input" id="hitl-dialog-label">补充说明</label>
      <textarea id="hitl-dialog-input" class="field" rows="3" placeholder="请输入提示或风险接受理由…"></textarea>
      <div class="dialog-actions">
        <button type="submit" class="btn btn-quiet" value="cancel">取消</button>
        <button type="submit" class="btn btn-primary" id="hitl-dialog-submit" value="confirm">确认提交</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast-bar" role="status" aria-live="polite" hidden></div>

  <script src="/static/ui.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
