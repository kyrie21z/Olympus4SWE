name: full_sdlc_tdd
description: >-
  Full SDLC with TDD-first vertical tracer-bullet slicing: every human gate stays enabled, the
  planner emits a thin runnable end-to-end skeleton slice followed by cohesive vertical
  user-story slices, each carrying its own executable seam check, and execution continues to
  the end of the task DAG.
family: sdlc
autonomy: gated
applicable_scenarios:
  - greenfield 0-to-1 product development requiring upfront GoalSpec and DesignSpec alignment
  - ambiguous multi-module systems needing explicit human spec, design, and plan approval gates
  - large parallelizable deliverables decomposed into disjoint TDD task DAGs
anti_patterns:
  - trivial single-file known-cause patch
  - read-only root-cause forensics without workspace edits
  - well-scoped brownfield feature or bugfix that does not need three human approval gates
stop_after: execute
topology: tdd_first
nodes:
  - name: intake
    type: intake_triage
  - name: align
    type: align_goal
    params:
      strict_canonical: true
  - name: critic
    type: critic_parallel
  - name: gate_spec
    type: human_gate
    params:
      gate: spec
  - name: design
    type: design_spec
  - name: validate_design
    type: validate_design
  - name: gate_design
    type: human_gate
    params:
      gate: design
  - name: plan
    type: pm_decompose
    params:
      use_design: true
  - name: validate_plan
    type: validate_plan
  - name: gate_plan
    type: human_gate
    params:
      gate: plan
  - name: execute
    type: execute_task_dag
edges:
  - source: START
    target: intake
  - source: align
    target: critic
  - source: critic
    target: gate_spec
  - source: gate_spec
    target: design
  - source: design
    target: validate_design
  - source: gate_design
    target: plan
  - source: plan
    target: validate_plan
  - source: gate_plan
    target: execute
  - source: execute
    target: END
routers:
  - at: intake
    key: route
    default: align
    rules:
      design_ready: validate_design
      goal_ready: gate_spec
      raw: align
  - at: align
    key: route
    default: critic
    rules:
      blocked: gate_spec
      ready: critic
  - at: critic
    key: route
    default: gate_spec
    rules:
      blocked: gate_spec
      ready: gate_spec
  - at: validate_design
    key: route
    default: gate_design
    rules:
      ok: gate_design
      fail: END
  - at: validate_plan
    key: route
    default: gate_plan
    rules:
      ok: gate_plan
      fail: END
gates:
  approve_spec: true
  approve_design: true
  approve_plan: true
