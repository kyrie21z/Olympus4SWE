<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta name="ariadne-source-sha256" content="f42facf18b9e8b265b648bba85c372a82bd7e02b3a00147b6eb5c4899df41d4d">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ariadne · Olympus4SWE</title>
  <link rel="icon" type="image/svg+xml" href="/static/assets/favicon.svg">
  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem("olympus-theme");
        if (savedTheme === "dark" || savedTheme === "light") {
          document.documentElement.dataset.theme = savedTheme;
        }
      } catch (error) {
        /* storage blocked — fall back to the default theme */
      }
      try {
        const fromUrl = new URLSearchParams(location.search).get("lang");
        const savedLocale = localStorage.getItem("olympus-locale");
        const locale =
          fromUrl === "zh" || fromUrl === "en"
            ? fromUrl
            : savedLocale === "zh" || savedLocale === "en"
              ? savedLocale
              : "en";
        document.documentElement.lang = locale === "zh" ? "zh-CN" : "en";
        document.documentElement.dataset.locale = locale;
      } catch (error) {
        document.documentElement.dataset.locale = "en";
      }
    })();
  </script>
  <script type="module" crossorigin src="/static/assets/ariadne.js"></script>
  <link rel="stylesheet" crossorigin href="/static/assets/ariadne.css">
</head>
<body data-dock="closed">
  <div id="root"></div>
</body>
</html>
